    <script src="https://cdn.tailwindcss.com"></script>
    <script>

        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // VS Code Light Theme inspired
              background: '#f3f3f3', 
              foreground: '#1e1e1e', 
              
              // VS Code Dark Theme inspired
              'background-dark': '#1e1e1e', 
              'foreground-dark': '#d4d4d4',

              'muted-dark': '#858585',

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      
      /* Smooth scrolling */
      html { scroll-behavior: smooth; }

      /* Scrollbar styling - Minimal */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #ccc;
